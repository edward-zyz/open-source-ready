name: Bug report
description: Report a problem with Open Source Ready
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps or a sample repository shape.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, shell, Codex environment, and relevant tool versions.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell
    validations:
      required: false
