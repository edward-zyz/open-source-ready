name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Validate skill metadata
        run: python3 .github/scripts/validate_skill.py .
      - name: Check shell syntax
        run: bash -n scripts/assess.sh
      - name: Smoke test assessment script
        run: bash scripts/assess.sh /tmp
