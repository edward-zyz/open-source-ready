name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Validate skill metadata
        run: python3 .github/scripts/validate_skill.py .
      - name: Check shell syntax
        run: bash -n scripts/assess.sh
      - name: Smoke test assessment script
        run: bash scripts/assess.sh /tmp
