name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Validate skill metadata
        run: python3 .github/scripts/validate_skill.py .
      - name: Check shell syntax
        run: bash -n scripts/assess.sh
      - name: Smoke test assessment script
        run: bash scripts/assess.sh /tmp
