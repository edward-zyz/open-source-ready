name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate skill metadata
        run: python3 .github/scripts/validate_skill.py .
      - name: Check shell syntax
        run: bash -n scripts/assess.sh
      - name: Smoke test assessment script
        run: bash scripts/assess.sh /tmp
