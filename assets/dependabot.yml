# .github/dependabot.yml — keep dependencies & GitHub Actions up to date.
# Uncomment the block(s) matching this repo's stack; delete the rest.
version: 2
updates:
  # GitHub Actions used in workflows (always recommended once you have CI)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

